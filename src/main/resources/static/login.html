<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transeasy · Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-wrap {
            min-height: calc(100vh - 0px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 2rem;
            color: var(--text);
        }
        .login-card h1 {
            margin: 0 0 0.2rem 0;
            font-size: 1.8rem;
            font-weight: 900;
        }
        .login-card p.muted {
            margin: 0 0 1.4rem 0;
        }
        .login-card label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .login-card input {
            display: block;
            width: 100%;
            margin-top: 0.3rem;
            padding: 0.55rem 0.6rem;
            border: 1px solid var(--line);
            font-family: inherit;
            font-size: 1rem;
        }
        .login-card .btn {
            width: 100%;
            margin-top: 0.4rem;
        }
        .login-msg {
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .login-msg.error {
            background: var(--danger);
            color: #fff;
        }
        .login-msg.info {
            background: var(--accent-2);
            color: #fff;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Transeasy</h1>
            <p>Gestión de clientes y transferencias</p>
        </div>
    </header>

    <main class="login-wrap">
        <div class="login-card">
            <h1>Iniciar sesión</h1>
            <p class="muted">Ingresa tus credenciales para continuar</p>

            <p id="login-error" class="login-msg error" hidden>Usuario o contraseña incorrectos.</p>
            <p id="login-logout" class="login-msg info" hidden>Sesión cerrada correctamente.</p>

            <form id="login-form" method="post" action="/login">
                <input type="hidden" name="_csrf" id="csrf-token">
                <label>Usuario
                    <input type="text" name="username" autocomplete="username" required autofocus>
                </label>
                <label>Contraseña
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn primary">Entrar</button>
            </form>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('login-error').hidden = false;
        }
        if (params.get('logout')) {
            document.getElementById('login-logout').hidden = false;
        }

        // Rellena el token CSRF expuesto vía cookie XSRF-TOKEN
        (function () {
            const match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
            if (match) {
                document.getElementById('csrf-token').value = decodeURIComponent(match[1]);
            }
        })();
    </script>
</body>
</html>
