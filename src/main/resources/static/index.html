<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transeasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Transeasy</h1>
            <p>Gestión de clientes y transferencias</p>
        </div>
        <nav class="nav">
            <button class="nav-btn active" data-view="customers">Gestión de clientes</button>
            <button class="nav-btn" data-view="transfer">Transferir dinero</button>
            <button class="nav-btn" data-view="history">Historial</button>
        </nav>
        <form id="logout-form" method="post" action="/logout">
            <input type="hidden" name="_csrf" id="csrf-token">
            <button type="submit" class="btn ghost">Cerrar sesión</button>
        </form>
    </header>

    <main>
        <p id="alert" class="alert" hidden></p>

        <section id="view-customers" class="view">
            <h2 id="customer-form-title">Agregar cliente</h2>
            <form id="customer-form" class="form-row">
                <input type="hidden" id="customer-id">
                <label>Nombres
                    <input type="text" id="firstName" required>
                </label>
                <label>Apellidos
                    <input type="text" id="lastName" required>
                </label>
                <label>Número de cuenta
                    <input type="text" id="accountNumber" required>
                </label>
                <label>Saldo
                    <input type="number" id="balance" min="0" step="0.01" required>
                </label>
                <div class="actions">
                    <button type="submit" class="btn primary">Guardar</button>
                    <button type="button" id="cancel-edit" class="btn ghost" hidden>Cancelar edición</button>
                </div>
            </form>

            <hr class="divider">

            <div class="section-head">
                <h2>Registros</h2>
                <button type="button" id="reload-customers" class="btn ghost">Actualizar</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Cuenta</th>
                            <th>Saldo</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="customers-body">
                        <tr><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="view-transfer" class="view" hidden>
            <h2>Transferencia entre cuentas</h2>
            <form id="transfer-form" class="form-stack">
                <label>Cuenta origen
                    <select id="senderAccount" required></select>
                </label>
                <label>Cuenta destino
                    <select id="receiverAccount" required></select>
                </label>
                <label>Valor
                    <input type="number" id="amount" min="0.01" step="0.01" required>
                </label>
                <button type="submit" class="btn primary">Transferir</button>
            </form>
        </section>

        <section id="view-history" class="view" hidden>
            <h2>Histórico de transacciones</h2>
            <form id="history-form" class="inline-form">
                <label>Cliente
                    <select id="history-customer" required></select>
                </label>
                <button type="submit" class="btn primary">Consultar</button>
            </form>
            <p id="history-subtitle" class="muted"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Monto</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="6">Seleccione un cliente para ver su historial.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // Rellena el token CSRF (expuesto vía cookie XSRF-TOKEN) para el logout
        (function () {
            const match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
            if (match) {
                document.getElementById('csrf-token').value = decodeURIComponent(match[1]);
            }
        })();
    </script>
    <script src="js/app.js"></script>
</body>
</html>
